
spring.jpa.show-sql=false

# -----------------------------------------------------------------------------
# Configurações do Client ECM OAuth2
# -----------------------------------------------------------------------------
spring.security.oauth2.client.registration.ecm.client-id=${ECM_CLIENT_ID}
spring.security.oauth2.client.registration.ecm.client-secret=${ECM_CLIENT_SECRET}
spring.security.oauth2.client.registration.ecm.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.ecm.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.ecm.token-uri=${ECM_TOKEN_URL}
ecm.base-url=${ECM_BASE_URL}
ecm.api-path=${ECM_API_PATH}