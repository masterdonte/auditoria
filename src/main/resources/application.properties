# Configuração da Aplicação
spring.application.name=auditoria-api

server.port=80
spring.profiles.active=@activatedProperties@

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
app.public-urls=/auth/**,/status,/static/**,/swagger-ui/**,/v3/api-docs/**

# -----------------------------------------------------------------------------
# DataSource Secundário (ClickHouse - Usado via JdbcTemplate)
# -----------------------------------------------------------------------------
clickhouse.datasource.jdbc-url=jdbc:clickhouse://clickhouse-datalake.apps.prod.emap.ma.gov.br:80
clickhouse.datasource.username=${CLICK_USER}
clickhouse.datasource.password=${CLICK_PASS}
clickhouse.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# -----------------------------------------------------------------------------
# Configurações do Spring Security LDAP
# -----------------------------------------------------------------------------
spring.ldap.urls=ldap://10.10.1.10:389
spring.ldap.base=DC=emap,DC=ma,DC=gov,DC=br
spring.ldap.username=CN=Consulta Ldap S2GPI,OU=S2GPI,DC=emap,DC=ma,DC=gov,DC=br
spring.ldap.password=${LDAP_PASS}

