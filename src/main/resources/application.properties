spring.application.name=auditoria-api

server.port=80

jwt.secret=${JWT_SECRET}
jwt.expiration=1800000
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.public-urls=/auth/login,/status,/static/**,/swagger-ui/**,/v3/api-docs/**

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# DataSource Secundário (ClickHouse - Usado via JdbcTemplate)
# -----------------------------------------------------------------------------
clickhouse.datasource.jdbc-url=jdbc:clickhouse://clickhouse-datalake.apps.prod.emap.ma.gov.br:80
clickhouse.datasource.username=${CLICK_USER}
clickhouse.datasource.password=${CLICK_PASS}
clickhouse.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# -----------------------------------------------------------------------------
# Configurações do Spring Security LDAP
# -----------------------------------------------------------------------------
spring.ldap.urls=ldap://10.10.1.10:389
spring.ldap.base=DC=emap,DC=ma,DC=gov,DC=br
spring.ldap.username=CN=Consulta Ldap S2GPI,OU=S2GPI,DC=emap,DC=ma,DC=gov,DC=br
spring.ldap.password=${LDAP_PASS}

# -----------------------------------------------------------------------------
# Configurações do Client ECM OAuth2
# -----------------------------------------------------------------------------
spring.security.oauth2.client.registration.ecm.client-id=${ECM_CLIENT_ID}
spring.security.oauth2.client.registration.ecm.client-secret=${ECM_CLIENT_SECRET}
spring.security.oauth2.client.registration.ecm.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.ecm.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.ecm.token-uri=${ECM_TOKEN_URL}
ecm.base-url=${ECM_BASE_URL}
ecm.api-path=${ECM_API_PATH}