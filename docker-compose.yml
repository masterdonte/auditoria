services:

  postgres:
    image: postgres:16.8
    container_name: postgres_16_8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: auditoria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  auditoria:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: dev
    container_name: auditoria
    ports:
      - "80:80"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CLICK_USER: ${CLICK_USER}
      CLICK_PASS: ${CLICK_PASS}
      LDAP_PASS: ${LDAP_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: